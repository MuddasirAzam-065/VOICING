services:

  - type: web
    name: voiceng-api
    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:

      - key: PYTHON_VERSION
        value: 3.13

      - key: MONGO_URI
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: LITELLM_URL
        sync: false

      - key: LITELLM_KEY
        sync: false

      - key: LLM_MODEL
        value: chat-model

      - key: ADMIN_API_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: SITE_URL
        sync: false

      - key: FIA_URL
        value: https://www.fia.gov.pk

      - key: LANGFUSE_PUBLIC_KEY
        sync: false

      - key: LANGFUSE_SECRET_KEY
        sync: false

      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com


  - type: web
    name: voiceng-litellm
    runtime: python

    rootDir: litellm

    buildCommand: pip install -r requirements.txt

    startCommand: litellm --config litellm_config.yaml --port $PORT

    envVars:

      - key: PYTHON_VERSION
        value: 3.13

      - key: HF_TOKEN
        sync: false

      - key: LITELLM_MASTER_KEY
        sync: false