name: Ingest knowledge base

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      persona:
        description: "voiceng, fia or both"
        default: "both"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Locate backend folder
        id: find
        run: |
          FILE=$(find . -name ingest.py -not -path './.git/*' | head -1)
          echo "Found: $FILE"
          if [ -z "$FILE" ]; then
            echo "ingest.py not found in this branch"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: pip install -r requirements.txt

      - name: Check secrets are present
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          for v in MONGO_URI GEMINI_API_KEY SITE_URL; do
            if [ -z "${!v}" ]; then echo "MISSING SECRET: $v"; exit 1; fi
          done
          echo "All secrets present"

      - name: Run ingestion
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FIA_URL: ${{ secrets.FIA_URL }}
        run: python -u ingest.py --persona "${{ inputs.persona || 'both' }}"
