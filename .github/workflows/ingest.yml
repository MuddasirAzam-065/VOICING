name: Ingest knowledge base

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      persona:
        description: "voiceng, fia or both"
        default: "both"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Locate backend folder
        id: find
        run: |
          find . -not -path './.git/*' -type f | head -60
          FILE=$(find . -name ingest.py -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "ingest.py is not in this branch. Commit and push it first."
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        working-directory: ${{ steps.find.outputs.dir }}

      - run: python ingest.py --persona "${{ inputs.persona || 'both' }}"
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FIA_URL: ${{ secrets.FIA_URL }}
