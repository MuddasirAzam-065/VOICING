name: Ingest knowledge base

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      persona:
        description: "voiceng, fia or both"
        default: "both"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: voiceng-bot/backend
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      FIA_URL: ${{ secrets.FIA_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "1. Install requirements.txt"
        run: |
          ls -la
          pip install -r requirements.txt
          python -c "import numpy, huggingface_hub, pymongo, bs4; print('requirements OK')"

      - name: "2. Install headless browser"
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: "3. Check secrets"
        run: |
          MISSING=""
          for v in MONGO_URI HF_TOKEN SITE_URL; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets are present."

      - name: "4. Check MongoDB and embeddings"
        run: |
          python -u - <<'EOF'
          import sys, traceback
          try:
              from core import db, embed
          except Exception:
              print("IMPORT core.py: FAILED")
              traceback.print_exc()
              sys.exit(1)
          try:
              db.command("ping")
              print("MongoDB: OK")
          except Exception:
              print("MongoDB: FAILED")
              traceback.print_exc()
              sys.exit(1)
          try:
              v = embed(["test"], "query")
              print("HF embeddings: OK, dim =", len(v[0]))
          except Exception:
              print("HF embeddings: FAILED")
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: "5. Run ingestion"
        run: |
          set -o pipefail
          python -u ingest.py --persona "${{ inputs.persona || 'both' }}" 2>&1 | tee /tmp/ingest.log

      - name: Show error summary
        if: failure()
        run: |
          {
            echo "## Ingestion failed"
            echo '```'
            tail -n 25 /tmp/ingest.log 2>/dev/null || echo "See the failed step above."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
